syntax = "proto3";

package logs;

service LogService {
    rpc ProcessLog(LogMessage) returns (LogAck);
}

message LogMessage {
    int32 log_id = 1;
    string content = 2;
    string timestamp = 3;
    string level = 4;
    string schema_version = 5;
}

message LogAck {
    bool success = 1;
    string message = 2;
}
